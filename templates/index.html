<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LectureSnipe - Panopto Note Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-primary:disabled,
        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result {
            display: none;
            margin-top: 30px;
            padding: 20px;
            border-radius: 5px;
        }
        
        .result.active {
            display: block;
        }
        
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .result h3 {
            margin-bottom: 10px;
        }
        
        .result .stats {
            margin: 15px 0;
        }
        
        .result .stats div {
            margin: 5px 0;
        }
        
        .result a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
        }
        
        .result a:hover {
            background: #218838;
        }
        
        .summary-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .advanced-options {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
        
        .advanced-options h3 {
            margin-bottom: 15px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 LectureSnipe</h1>
            <p>Convert Panopto lectures into readable notes</p>
        </div>
        
        <div class="content">
            <form id="lectureForm">
                <div class="form-group">
                    <label for="panoptoUrl">Panopto Lecture URL *</label>
                    <input type="text" id="panoptoUrl" name="url" 
                           placeholder="https://university.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=..."
                           required>
                </div>
                
                <div class="form-group">
                    <label for="username">Username (optional - for locked lectures)</label>
                    <input type="text" id="username" name="username" 
                           placeholder="Your Panopto username">
                </div>
                
                <div class="form-group">
                    <label for="password">Password (optional)</label>
                    <input type="password" id="password" name="password" 
                           placeholder="Your Panopto password">
                </div>
                
                <div class="advanced-options">
                    <h3>⚙️ Options</h3>
                    
                    <div class="form-group">
                        <label for="format">Output Format</label>
                        <select id="format" name="format">
                            <option value="markdown">Markdown (.md)</option>
                            <option value="html">HTML (.html)</option>
                            <option value="text">Plain Text (.txt)</option>
                        </select>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="includeStudents" name="include_students">
                        <label for="includeStudents">Include student questions</label>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="includeTimestamps" name="include_timestamps">
                        <label for="includeTimestamps">Include timestamps</label>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="downloadSlides" name="download_slides" checked>
                        <label for="downloadSlides">Download slides</label>
                    </div>
                    
                    <div class="form-group">
                        <label for="summaryType">Summary Type (for quick summary)</label>
                        <select id="summaryType" name="summary_type">
                            <option value="brief">Brief Summary</option>
                            <option value="detailed">Detailed Summary</option>
                            <option value="key_points">Key Points Only</option>
                        </select>
                    </div>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn-primary">Generate Full Notes</button>
                    <button type="button" id="summaryBtn" class="btn-secondary">Quick Summary</button>
                </div>
            </form>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing lecture... This may take a few minutes.</p>
            </div>
            
            <div class="result" id="result">
                <!-- Results will be displayed here -->
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('lectureForm');
        const summaryBtn = document.getElementById('summaryBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            await processLecture();
        });
        
        summaryBtn.addEventListener('click', async () => {
            await generateSummary();
        });
        
        async function processLecture() {
            // Show loading
            loading.classList.add('active');
            result.classList.remove('active');
            
            // Disable buttons
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => btn.disabled = true);
            
            try {
                const formData = {
                    url: document.getElementById('panoptoUrl').value,
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                    format: document.getElementById('format').value,
                    include_students: document.getElementById('includeStudents').checked,
                    include_timestamps: document.getElementById('includeTimestamps').checked,
                    download_slides: document.getElementById('downloadSlides').checked
                };
                
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess(data);
                } else {
                    showError(data.error || 'An error occurred');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                loading.classList.remove('active');
                buttons.forEach(btn => btn.disabled = false);
            }
        }
        
        async function generateSummary() {
            loading.classList.add('active');
            result.classList.remove('active');
            
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => btn.disabled = true);
            
            try {
                const formData = {
                    url: document.getElementById('panoptoUrl').value,
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                    summary_type: document.getElementById('summaryType').value,
                    include_students: document.getElementById('includeStudents').checked
                };
                
                const response = await fetch('/api/summary', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSummary(data.summary);
                } else {
                    showError(data.error || 'An error occurred');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                loading.classList.remove('active');
                buttons.forEach(btn => btn.disabled = false);
            }
        }
        
        function showSuccess(data) {
            result.className = 'result active success';
            
            const filename = data.notes_path.split('/').pop();
            
            result.innerHTML = `
                <h3>✅ Success!</h3>
                <p>Your lecture notes have been generated successfully.</p>
                <div class="stats">
                    <div><strong>Transcript entries:</strong> ${data.stats.transcript_entries}</div>
                    <div><strong>Slides downloaded:</strong> ${data.stats.slides_downloaded}</div>
                    <div><strong>Session ID:</strong> ${data.session_id}</div>
                </div>
                <a href="/download/${filename}" download>Download Notes</a>
            `;
        }
        
        function showSummary(summary) {
            result.className = 'result active success';
            result.innerHTML = `
                <h3>📝 Lecture Summary</h3>
                <div class="summary-box">${summary.replace(/\n/g, '<br>')}</div>
            `;
        }
        
        function showError(error) {
            result.className = 'result active error';
            result.innerHTML = `
                <h3>❌ Error</h3>
                <p>${error}</p>
            `;
        }
    </script>
</body>
</html>
